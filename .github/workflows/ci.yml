name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PR runs replace each other; runs on main always finish (each is a release candidate).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Maven verify (tests, JaCoCo gate, SpotBugs) — Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven verify (compile, unit/integration tests, JaCoCo >= 80 % lines, SpotBugs, package)
        run: mvn -B verify

      - name: Coverage summary
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || exit 0
          awk -F, 'NR>1 { ml+=$8; cl+=$9; mb+=$6; cb+=$7 }
            END { printf "### JaCoCo\n\nLines: **%.1f %%** (%d/%d) · Branches: **%.1f %%**\n", 100*cl/(ml+cl), cl, ml+cl, 100*cb/(mb+cb) }' \
            "$csv" >>"$GITHUB_STEP_SUMMARY"

      - name: Verify frontend script syntax
        run: node --check src/main/resources/static/js/script.js

      - name: Upload JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyjolt-jar
          path: target/keyjolt-*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  dependency-scan:
    name: Trivy dependency scan (built JAR)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: keyjolt-jar
          path: ${{ runner.temp }}/scan

      # Trivy runs from its official image pinned by digest (not trivy-action).
      # It reads every library embedded in the Spring Boot fat JAR (BOOT-INF/lib).
      # Accepted findings go in .trivyignore (repo root) with a reason.
      - name: Trivy report
        id: trivy
        env:
          TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          SCAN_DIR: ${{ runner.temp }}/scan
        run: |
          out="$RUNNER_TEMP/trivy"
          mkdir -p "$out/cache"
          trivy() {
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$SCAN_DIR:/scan:ro" -v "$PWD:/src:ro" -w /src \
              -v "$out:/out" -v "$out/cache:/cache" \
              "$TRIVY_IMAGE" rootfs --cache-dir /cache --quiet --scanners vuln "$@" /scan
          }
          trivy --format sarif --output /out/trivy.sarif
          trivy --severity CRITICAL,HIGH --ignore-unfixed --format json --output /out/fixable.json
          crit=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "$out/fixable.json")
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "$out/fixable.json")
          echo "critical=$crit" >>"$GITHUB_OUTPUT"
          echo "high=$high" >>"$GITHUB_OUTPUT"
          {
            echo "### Trivy: KeyJolt JAR dependencies"
            echo
            echo "Fixable: **$crit CRITICAL**, **$high HIGH**. All severities, fixed or not, are in the Security tab."
            if [ "$((crit + high))" -gt 0 ]; then
              echo
              echo "| Severity | Package | Installed | Fixed in | ID |"
              echo "|---|---|---|---|---|"
              jq -r '.Results[]? | .Vulnerabilities[]? | "| \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion) | \(.VulnerabilityID) |"' "$out/fixable.json" | sort -u
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy results to the Security tab
        if: always() && steps.trivy.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ${{ runner.temp }}/trivy/trivy.sarif
          category: trivy-jar

      - name: Trivy gate (fixable CRITICAL)
        env:
          CRIT: ${{ steps.trivy.outputs.critical }}
          HIGH: ${{ steps.trivy.outputs.high }}
        run: |
          if [ "$HIGH" -gt 0 ]; then
            echo "::warning::$HIGH fixable HIGH finding(s); see the job summary"
          fi
          if [ "$CRIT" -gt 0 ]; then
            echo "::error::$CRIT fixable CRITICAL finding(s); see the job summary"
            exit 1
          fi

  e2e:
    name: Playwright smoke (built JAR on 127.0.0.1:5095)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: keyjolt-jar
          path: ${{ runner.temp }}/jar

      - name: Install Playwright and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # run-local.mjs boots the JAR with --app.temp-dir=$KEYJOLT_TEMP_DIR and
      # --app.trusted-proxy=true, waits for /healthz, runs the suite, stops the
      # app with SIGTERM and fails if any key file or download token survives.
      - name: Run smoke suite
        env:
          KEYJOLT_TEMP_DIR: /tmp/keyjolt-ci-e2e
        run: |
          set -- "$RUNNER_TEMP"/jar/keyjolt-*.jar
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected one JAR, got: $*"
            exit 1
          fi
          jar=$1
          version=$(basename "$jar" .jar | sed 's/^keyjolt-//')
          KEYJOLT_JAR="$jar" KEYJOLT_EXPECTED_VERSION="$version" npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
