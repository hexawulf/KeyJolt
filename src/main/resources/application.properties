# Server Configuration
# Uses Railway's PORT env var if available, otherwise defaults to 5005 for Raspberry Pi
server.port=${PORT:5005}
server.address=0.0.0.0

# Application Configuration
app.name=KeyJolt
app.version=1.1.4
app.temp-dir=${java.io.tmpdir}/keyjolt
app.key-cleanup-delay=300000
app.max-file-size=10MB

# Rate Limiting
app.rate-limit.requests-per-hour=10
app.rate-limit.burst-capacity=5

# RSA generations allowed at once, and how long a request waits for a free
# slot before it gets 503 + Retry-After.
app.generation.max-concurrent=2
app.generation.queue-wait-ms=5000

# Set to true only when behind a trusted reverse proxy (nginx, etc.) that
# overwrites X-Real-IP. Production (piapps) enables it via ecosystem.config.cjs.
app.trusted-proxy=false

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Static assets: cacheable for a week. CSS/JS URLs carry a content hash
# (style-<md5>.css), so a new release is picked up immediately.
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.keyjolt=INFO
logging.level.org.springframework.security=WARN
# Appenders and patterns live in logback-spring.xml

# Environment Variables (with defaults)
app.encryption.default-strength=4096
app.encryption.max-expiry-days=3650
